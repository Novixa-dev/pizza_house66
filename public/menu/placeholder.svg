<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="640" height="640" role="img">
  <defs>
    <radialGradient id="bg" cx="42%" cy="34%" r="78%">
      <stop offset="0%" stop-color="#f4ece0"/>
      <stop offset="70%" stop-color="#ded0bb"/>
      <stop offset="100%" stop-color="#d0c2ad"/>
    </radialGradient>
    <radialGradient id="rim" cx="36%" cy="30%" r="68%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.30"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.16"/>
    </radialGradient>
    <filter id="drop" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#2b1708" flood-opacity="0.30"/>
    </filter>
    <filter id="soften" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="1.1"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="5"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>
  <rect width="640" height="640" fill="url(#bg)"/>
  <g opacity="0.55">
    <circle cx="320" cy="320" r="150" fill="none" stroke="#a08b6d" stroke-width="12" stroke-dasharray="26 20"/>
    <path d="M250 352 l44 -52 38 40 32 -34 46 58 z" fill="#a08b6d"/>
    <circle cx="272" cy="276" r="20" fill="#a08b6d"/>
  </g>
  <rect width="640" height="640" filter="url(#grain)" opacity="0.05" style="mix-blend-mode:multiply"/>
  <rect width="640" height="640" fill="url(#rim)"/>
</svg>
