name: Deploy

# Ships main to Railway, but only after CI has agreed the commit is sound.
#
# Railway's own GitHub integration deploys on every push to the connected
# branch, with no idea whether the tests passed. That is fine until the day a
# broken commit reaches main during service hours and the restaurant's
# ordering page goes down while the kitchen is full. This workflow is the
# gate: it waits for the CI run on the same commit, and it deploys nothing if
# that run failed.
#
# Set `RAILWAY_TOKEN` (a project token from Railway → project → Settings →
# Tokens) in the repository's Actions secrets, and turn OFF Railway's own
# automatic deploys for the connected branch, or both will deploy and the
# gate is pointless.

on:
  push:
    branches: [main]
  # A deploy you can trigger by hand matters on the evening something needs
  # to go out and CI is having a bad day.
  workflow_dispatch:
    inputs:
      skip_ci_gate:
        description: "Deploy without waiting for CI (use only when you know why)"
        type: boolean
        default: false

# One deploy at a time, and never cancel one in flight: a half-applied
# migration is far worse than a queued deploy.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  wait-for-ci:
    name: Wait for CI
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || !inputs.skip_ci_gate
    steps:
      - name: Wait for the CI run on this commit
        uses: lewagon/wait-on-check-action@v1.3.4
        with:
          ref: ${{ github.sha }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          # Every CI job by name. Listing them rather than waiting on "all
          # checks" means a new unrelated check cannot silently become a
          # deploy blocker, and a renamed job fails loudly here instead of
          # being skipped.
          check-name: |
            Typecheck, lint, unit tests
            Production build (no devDependencies)
            Integration tests
            End-to-end tests
          wait-interval: 15
          allowed-conclusions: success

  deploy:
    name: Deploy to Railway
    runs-on: ubuntu-latest
    needs: [wait-for-ci]
    # `always()` so a manual run with the gate skipped still reaches here;
    # the condition then rejects an actual CI failure.
    if: always() && (needs.wait-for-ci.result == 'success' || inputs.skip_ci_gate)
    environment:
      name: production
      url: https://app-production-656a.up.railway.app
    steps:
      - uses: actions/checkout@v4

      - name: Fail early with a useful message if the token is missing
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        # Checked in the shell rather than in an `if:` expression, so the
        # message says what to do instead of the job being silently skipped.
        run: |
          if [ -z "${RAILWAY_TOKEN:-}" ]; then
            echo "::error::RAILWAY_TOKEN is not set. Create a project token in"
            echo "::error::Railway (project → Settings → Tokens) and add it under"
            echo "::error::this repo's Settings → Secrets and variables → Actions."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Deploy
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        # `up --ci` streams the build log and, crucially, exits non-zero when
        # the deploy fails — without it the step goes green on a failed build
        # and the next thing anyone hears is a customer.
        run: npx --yes @railway/cli@latest up --ci --service app

      - name: Check the deployed site answers
        run: |
          set -euo pipefail
          url="https://app-production-656a.up.railway.app"
          for attempt in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$url" || echo 000)
            if [ "$code" = "200" ]; then
              echo "$url answered 200 after ${attempt} attempt(s)."
              exit 0
            fi
            echo "attempt ${attempt}: $code"
            sleep 15
          done
          echo "::error::$url never answered 200 after the deploy."
          exit 1
